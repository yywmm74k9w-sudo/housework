<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>家事ログ</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#f7f7f5;min-height:100vh;}
    #app{max-width:480px;margin:0 auto;width:100%;min-height:100vh;display:flex;flex-direction:column;position:relative;}
    .section{background:#fff;margin:12px 12px 0;border-radius:16px;padding:16px;box-shadow:0 1px 4px #0000000a;}
    .section-label{font-size:12px;font-weight:600;color:#999;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;}
    #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#2d2d2d;color:#fff;padding:10px 20px;border-radius:100px;font-size:14px;z-index:100;white-space:nowrap;box-shadow:0 4px 12px #0003;opacity:0;transition:opacity 0.2s;pointer-events:none;}
    button:active{opacity:0.75;}
    .btn-primary{width:100%;background:#FF6B6B;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:12px;}
    .btn-secondary{width:100%;background:#f0f0f0;color:#333;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;}
    .card{margin:60px 24px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 4px 20px #0000000f;text-align:center;}
    .input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:12px;font-size:14px;outline:none;margin-bottom:12px;}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
// ── ユーティリティ ──
function saveCache(key, data) { try { localStorage.setItem("chores_"+key, JSON.stringify(data)); } catch(e) {} }
function loadCache(key) { try { var d = localStorage.getItem("chores_"+key); return d ? JSON.parse(d) : null; } catch(e) { return null; } }
function generateCode() { return Math.random().toString(36).substring(2,8).toUpperCase(); }

var DEFAULT_TASKS = [
  {id:"t1",name:"料理",icon:"🍳",points:3},
  {id:"t2",name:"食器洗い",icon:"🍽️",points:2},
  {id:"t3",name:"洗濯",icon:"👕",points:2},
  {id:"t4",name:"掃除機",icon:"🧹",points:2},
  {id:"t5",name:"風呂掃除",icon:"🛁",points:2},
  {id:"t6",name:"買い物",icon:"🛒",points:2},
  {id:"t7",name:"ゴミ出し",icon:"🗑️",points:1},
  {id:"t8",name:"トイレ掃除",icon:"🚽",points:1},
];
var MEMBER_COLORS = [
  {bg:"#FF6B6B",light:"#FFE5E5",text:"#c0392b"},
  {bg:"#4ECDC4",light:"#E0F7F5",text:"#1a8c87"},
  {bg:"#FFD93D",light:"#FFF9E0",text:"#b7860b"},
  {bg:"#A78BFA",light:"#EDE9FE",text:"#6d28d9"},
];
function memberColor(i){ return MEMBER_COLORS[i % MEMBER_COLORS.length]; }
function formatDt(ts){
  if(!ts) return "";
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return (d.getMonth()+1)+"/"+(d.getDate())+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function getWeekRange(){
  var now=new Date(),day=now.getDay();
  var mon=new Date(now); mon.setDate(now.getDate()-day+(day===0?-6:1));
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  var fmt=function(d){return (d.getMonth()+1)+"/"+(d.getDate());};
  return fmt(mon)+" 〜 "+fmt(sun);
}
function getTodayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function getWeekKeys(){
  var now=new Date(),day=now.getDay();
  var mon=new Date(now); mon.setDate(now.getDate()-day+(day===0?-6:1));
  var keys=[];
  for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);keys.push(d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate());}
  return keys;
}

// ── 状態 ──
var groupId = loadCache("groupId");
var db = null;
var unsubscribers = [];

var state = {
  screen: "home",
  groupScreen: groupId ? "loading" : "welcome",
  members: loadCache("members") || [],
  tasks: loadCache("tasks") || DEFAULT_TASKS.slice(),
  logs: loadCache("logs") || [],
  recurring: loadCache("recurring") || [],
  selectedMember: null,
  statsRange: "week",
  newMemberName: "",
  newTaskName: "",
  newTaskIcon: "✨",
  newTaskPoints: 2,
  newRecurringName: "",
  newRecurringIcon: "🔁",
  newRecurringPoints: 3,
  newRecurringInterval: 7,
  joinCode: "",
  groupName: "",
  errorMsg: "",
};

// ── 即座に最初の画面を描画 ──
render();

// ── Firebase を非同期で読み込む ──
var script = document.createElement("script");
script.type = "module";
script.textContent = [
  'import{initializeApp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";',
  'import{getFirestore,collection,doc,setDoc,getDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";',
  'try{',
  '  var app=initializeApp('+JSON.stringify({
    apiKey:"AIzaSyDU9BcaCWGqapWezTqwYzYsywpCjfstSiE",
    authDomain:"housework-80f77.firebaseapp.com",
    projectId:"housework-80f77",
    storageBucket:"housework-80f77.firebasestorage.app",
    messagingSenderId:"26580994101",
    appId:"1:26580994101:web:2bc4d94f0ba84d11c2097c"
  })+');',
  '  window._db=getFirestore(app);',
  '  window._fs={collection,doc,setDoc,getDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp};',
  '  window.firebaseReady();',
  '}catch(e){console.error(e);window.firebaseReady();}'
].join("");
document.head.appendChild(script);

window.firebaseReady = function() {
  db = window._db;
  if (groupId) {
    subscribeGroup(groupId);
  }
};

// ── Firestore購読 ──
function subscribeGroup(gid) {
  unsubscribers.forEach(function(u){u();});
  unsubscribers = [];
  if (!db) { state.groupScreen="app"; render(); return; }
  var fs = window._fs;
  state.groupScreen = "app";
  try {
    unsubscribers.push(fs.onSnapshot(fs.collection(db,"groups",gid,"members"), function(snap){
      state.members = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).sort(function(a,b){return (a.order||0)-(b.order||0);});
      saveCache("members", state.members);
      render();
    }, function(e){console.error(e);}));
    unsubscribers.push(fs.onSnapshot(fs.collection(db,"groups",gid,"tasks"), function(snap){
      var l = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      state.tasks = l.length>0 ? l : DEFAULT_TASKS.slice();
      saveCache("tasks", state.tasks);
      render();
    }, function(e){console.error(e);}));
    unsubscribers.push(fs.onSnapshot(fs.query(fs.collection(db,"groups",gid,"logs"),fs.orderBy("ts","desc")), function(snap){
      state.logs = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      saveCache("logs", state.logs);
      render();
    }, function(e){console.error(e);}));
    unsubscribers.push(fs.onSnapshot(fs.collection(db,"groups",gid,"recurring"), function(snap){
      state.recurring = snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      saveCache("recurring", state.recurring);
      render();
    }, function(e){console.error(e);}));
  } catch(e){console.error(e);}
  render();
}

// ── アクション ──
function createGroup() {
  var name = state.groupName.trim();
  if (!name) { state.errorMsg="グループ名を入力してください"; render(); return; }
  if (!db) { state.errorMsg="接続中です。少し待ってから再試行してください"; render(); return; }
  var fs = window._fs;
  var code = generateCode();
  fs.setDoc(fs.doc(db,"groups",code),{name:name,createdAt:fs.serverTimestamp()}).then(function(){
    groupId = code;
    saveCache("groupId", code);
    state.members=[]; state.tasks=DEFAULT_TASKS.slice(); state.logs=[];
    state.groupScreen="app"; state.errorMsg=""; state.groupName="";
    subscribeGroup(code);
    showToast("グループ作成完了！招待コード: "+code);
    render();
  }).catch(function(){ state.errorMsg="作成に失敗しました"; render(); });
}

function joinGroup() {
  var code = state.joinCode.trim().toUpperCase();
  if (!code) { state.errorMsg="招待コードを入力してください"; render(); return; }
  if (!db) { state.errorMsg="接続中です。少し待ってから再試行してください"; render(); return; }
  var fs = window._fs;
  fs.getDoc(fs.doc(db,"groups",code)).then(function(snap){
    if (!snap.exists()) { state.errorMsg="グループが見つかりません"; render(); return; }
    groupId = code;
    saveCache("groupId", code);
    state.groupScreen="app"; state.errorMsg=""; state.joinCode="";
    subscribeGroup(code);
    showToast("「"+snap.data().name+"」に参加しました！");
    render();
  }).catch(function(){ state.errorMsg="参加に失敗しました"; render(); });
}

function leaveGroup() {
  if (!confirm("このグループから退出しますか？")) return;
  unsubscribers.forEach(function(u){u();}); unsubscribers=[];
  groupId=null;
  ["groupId","members","tasks","logs","recurring"].forEach(function(k){localStorage.removeItem("chores_"+k);});
  state.members=[]; state.tasks=DEFAULT_TASKS.slice(); state.logs=[]; state.recurring=[];
  state.groupScreen="welcome"; state.screen="home";
  render();
}

function logTask(task) {
  if(!state.selectedMember){showToast("メンバーを選んでね！");return;}
  if(!db){showToast("接続中です…");return;}
  var fs=window._fs;
  fs.setDoc(fs.doc(db,"groups",groupId,"logs",Date.now().toString()),{
    memberId:state.selectedMember,taskId:task.id,taskName:task.name,taskIcon:task.icon,
    points:task.points,date:getTodayKey(),ts:fs.serverTimestamp()
  }).then(function(){showToast(task.icon+" "+task.name+" を記録したよ！");})
  .catch(function(){showToast("記録に失敗しました");});
}
function undoLast(){
  if(!state.logs.length||!db)return;
  var fs=window._fs;
  fs.deleteDoc(fs.doc(db,"groups",groupId,"logs",state.logs[0].id))
  .then(function(){showToast("取り消したよ");}).catch(function(){});
}
function addMember(){
  var n=state.newMemberName.trim(); if(!n||!db)return;
  var fs=window._fs;
  fs.setDoc(fs.doc(db,"groups",groupId,"members",Date.now().toString()),{name:n,order:state.members.length})
  .then(function(){state.newMemberName="";showToast("追加しました");}).catch(function(){showToast("失敗しました");});
}
function deleteMember(id){
  if(state.members.length<=1){showToast("最低1人必要");return;}
  if(!db)return;
  var fs=window._fs;
  fs.deleteDoc(fs.doc(db,"groups",groupId,"members",id)).then(function(){
    if(state.selectedMember===id)state.selectedMember=null;
  }).catch(function(){});
}
function addTask(){
  var n=state.newTaskName.trim(); if(!n||!db)return;
  var fs=window._fs;
  fs.setDoc(fs.doc(db,"groups",groupId,"tasks",Date.now().toString()),{name:n,icon:state.newTaskIcon||"✨",points:state.newTaskPoints})
  .then(function(){state.newTaskName="";state.newTaskIcon="✨";state.newTaskPoints=2;showToast("追加しました");}).catch(function(){});
}
function deleteTask(id){
  if(!db)return; var fs=window._fs;
  fs.deleteDoc(fs.doc(db,"groups",groupId,"tasks",id)).catch(function(){});
}
function clearLogs(){
  if(!confirm("全記録を削除しますか?")||!db)return;
  var fs=window._fs;
  Promise.all(state.logs.map(function(l){return fs.deleteDoc(fs.doc(db,"groups",groupId,"logs",l.id));}))
  .then(function(){showToast("削除しました");}).catch(function(){});
}

// ── 定期タスク ──
function addRecurring(){
  var n=state.newRecurringName.trim();
  if(!n||!db)return;
  var fs=window._fs;
  var nowMs=Date.now();
  fs.setDoc(fs.doc(db,"groups",groupId,"recurring",nowMs.toString()),{
    name:n,
    icon:state.newRecurringIcon||"🔁",
    points:state.newRecurringPoints,
    intervalDays:state.newRecurringInterval,
    nextDueMs:nowMs,
    createdAt:nowMs
  }).then(function(){
    state.newRecurringName=""; state.newRecurringIcon="🔁";
    state.newRecurringPoints=3; state.newRecurringInterval=7;
    showToast("追加しました");
  }).catch(function(){showToast("失敗しました");});
}

function deleteRecurring(id){
  if(!db)return; var fs=window._fs;
  fs.deleteDoc(fs.doc(db,"groups",groupId,"recurring",id)).catch(function(){});
}

function completeRecurring(r){
  if(!state.selectedMember){showToast("メンバーを選んでね！");return;}
  if(!db)return;
  var fs=window._fs;
  var nowMs=Date.now();
  var nextDue=nowMs+(r.intervalDays*24*60*60*1000);
  // 貢献ログに記録
  fs.setDoc(fs.doc(db,"groups",groupId,"logs",nowMs.toString()),{
    memberId:state.selectedMember,
    taskId:"r_"+r.id,
    taskName:r.name,
    taskIcon:r.icon,
    points:r.points,
    date:getTodayKey(),
    ts:fs.serverTimestamp()
  });
  // 次回期日を更新
  fs.setDoc(fs.doc(db,"groups",groupId,"recurring",r.id),Object.assign({},r,{
    nextDueMs:nextDue,
    lastCompletedMs:nowMs,
    lastCompletedBy:state.selectedMember
  }),{merge:true}).then(function(){
    showToast(r.icon+" "+r.name+" を完了！次回: "+formatInterval(r.intervalDays)+"後");
  });
}

function formatInterval(days){
  if(days===1)return "明日";
  if(days===7)return "1週間";
  if(days===14)return "2週間";
  if(days===30)return "1ヶ月";
  if(days===90)return "3ヶ月";
  if(days===180)return "半年";
  if(days===365)return "1年";
  return days+"日";
}

function daysUntil(ms){
  var diff=ms-Date.now();
  return Math.ceil(diff/(24*60*60*1000));
}

function formatDueStatus(r){
  var days=daysUntil(r.nextDueMs);
  if(days<0)return {text:Math.abs(days)+"日超過",color:"#FF6B6B",bg:"#FFE5E5",overdue:true};
  if(days===0)return {text:"今日まで",color:"#E67E22",bg:"#FFF4E5",overdue:false,today:true};
  if(days<=3)return {text:"あと"+days+"日",color:"#E67E22",bg:"#FFF4E5",overdue:false};
  return {text:"あと"+days+"日",color:"#999",bg:"#f5f5f5",overdue:false};
}

var toastTimer=null;
function showToast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.style.opacity="1";
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.opacity="0";},2500);
}

function getFilteredLogs(){
  if(state.statsRange==="week"){var k=getWeekKeys();return state.logs.filter(function(l){return k.indexOf(l.date)>=0;});}
  if(state.statsRange==="month"){var now=new Date();var p=now.getFullYear()+"-"+(now.getMonth()+1);return state.logs.filter(function(l){return l.date&&l.date.startsWith(p);});}
  return state.logs;
}
function getStats(){
  var f=getFilteredLogs();
  return state.members.map(function(m){
    return Object.assign({},m,{
      total:f.filter(function(l){return l.memberId===m.id;}).reduce(function(s,l){return s+(l.points||0);},0),
      count:f.filter(function(l){return l.memberId===m.id;}).length
    });
  });
}

// ── 描画 ──
function render(){
  var root=document.getElementById("app");
  if(state.groupScreen==="welcome"||state.groupScreen==="create"||state.groupScreen==="join"){
    root.innerHTML=groupHTML(); bindGroup(); return;
  }
  if(state.groupScreen==="loading"){
    root.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:80vh;color:#999;">読み込み中…</div>';
    return;
  }
  if(state.members.length===0){root.innerHTML=setupHTML();bindSetup();return;}
  root.innerHTML=mainHTML();bindMain();
}

function groupHTML(){
  if(state.groupScreen==="welcome") return '<div class="card"><div style="font-size:56px;margin-bottom:16px;">🏠</div><h1 style="font-size:20px;font-weight:700;margin-bottom:8px;">家事分担アプリ</h1><p style="font-size:14px;color:#999;margin-bottom:32px;">グループを作成するか、招待コードで参加してください</p><button class="btn-primary" id="btn-create">新しいグループを作成</button><button class="btn-secondary" id="btn-join">招待コードで参加</button></div>';
  if(state.groupScreen==="create") return '<div class="card"><button id="btn-back" style="background:none;border:none;color:#999;font-size:14px;cursor:pointer;display:block;margin-bottom:16px;">← 戻る</button><div style="font-size:40px;margin-bottom:16px;">🏡</div><h2 style="font-size:18px;font-weight:700;margin-bottom:24px;">グループを作成</h2><p style="font-size:13px;color:#999;margin-bottom:8px;text-align:left;">グループ名（例：田中家）</p><input id="group-name" class="input" placeholder="グループ名を入力" value="'+state.groupName+'" />'+(state.errorMsg?'<p style="color:#FF6B6B;font-size:13px;margin-bottom:12px;">'+state.errorMsg+'</p>':'')+'<button class="btn-primary" id="btn-create-confirm">作成する</button></div>';
  if(state.groupScreen==="join") return '<div class="card"><button id="btn-back" style="background:none;border:none;color:#999;font-size:14px;cursor:pointer;display:block;margin-bottom:16px;">← 戻る</button><div style="font-size:40px;margin-bottom:16px;">🔑</div><h2 style="font-size:18px;font-weight:700;margin-bottom:24px;">グループに参加</h2><p style="font-size:13px;color:#999;margin-bottom:8px;text-align:left;">招待コード（6桁）</p><input id="join-code" class="input" placeholder="XXXXXX" maxlength="6" style="text-align:center;letter-spacing:4px;font-size:18px;text-transform:uppercase;" value="'+state.joinCode+'" />'+(state.errorMsg?'<p style="color:#FF6B6B;font-size:13px;margin-bottom:12px;">'+state.errorMsg+'</p>':'')+'<button class="btn-primary" id="btn-join-confirm" style="background:#4ECDC4;">参加する</button></div>';
}

function bindGroup(){
  var bc=document.getElementById("btn-create");
  if(bc)bc.onclick=function(){state.groupScreen="create";state.errorMsg="";render();};
  var bj=document.getElementById("btn-join");
  if(bj)bj.onclick=function(){state.groupScreen="join";state.errorMsg="";render();};
  var bb=document.getElementById("btn-back");
  if(bb)bb.onclick=function(){state.groupScreen="welcome";state.errorMsg="";render();};
  var gn=document.getElementById("group-name");
  if(gn){gn.oninput=function(e){state.groupName=e.target.value;};}
  var bcc=document.getElementById("btn-create-confirm");
  if(bcc)bcc.onclick=createGroup;
  var jc=document.getElementById("join-code");
  if(jc){jc.oninput=function(e){state.joinCode=e.target.value;};}
  var bjc=document.getElementById("btn-join-confirm");
  if(bjc)bjc.onclick=joinGroup;
}

function setupHTML(){
  return '<div class="card"><div style="font-size:56px;margin-bottom:16px;">👥</div><h1 style="font-size:20px;font-weight:700;margin-bottom:8px;">メンバーを登録</h1><p style="font-size:14px;color:#999;margin-bottom:24px;">グループコード: <strong>'+groupId+'</strong></p><div style="display:flex;gap:8px;"><input id="setup-name" class="input" style="margin:0;flex:1;" placeholder="名前を入力（例：たろう）" value="'+state.newMemberName+'" /><button style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;" id="setup-add">追加</button></div></div>';
}
function bindSetup(){
  var sn=document.getElementById("setup-name");
  if(sn){sn.oninput=function(e){state.newMemberName=e.target.value;};sn.onkeydown=function(e){if(e.key==="Enter")addMember();};}
  var sa=document.getElementById("setup-add");
  if(sa)sa.onclick=addMember;
}

function mainHTML(){
  var stats=getStats(),totalPts=stats.reduce(function(s,m){return s+m.total;},0);
  var home='';
  if(state.screen==="home"){
    home+='<div class="section"><div class="section-label">だれがやる？</div><div style="display:flex;gap:10px;flex-wrap:wrap;">';
    state.members.forEach(function(m,i){
      var c=memberColor(i),a=state.selectedMember===m.id;
      home+='<button class="member-btn" data-id="'+m.id+'" style="padding:10px 20px;border-radius:100px;font-weight:600;font-size:15px;cursor:pointer;border:2px solid '+(a?c.bg:c.bg+'30')+';background:'+(a?c.bg:c.light)+';color:'+(a?'#fff':c.text)+';transform:'+(a?'scale(1.06)':'scale(1)')+';transition:all 0.15s;">'+m.name+'</button>';
    });
    home+='</div></div>';
    home+='<div class="section"><div class="section-label">何をした？</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">';
    state.tasks.forEach(function(t){
      home+='<button class="task-btn" data-task=\''+JSON.stringify(t).replace(/'/g,"&#39;")+'\' style="background:#f7f7f5;border:none;border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="font-size:28px;">'+t.icon+'</span><span style="font-size:12px;font-weight:600;color:#333;">'+t.name+'</span><span style="font-size:11px;color:#FF6B6B;font-weight:700;">+'+t.points+'pt</span></button>';
    });
    home+='</div></div>';
    if(state.logs.length>0){
      home+='<div class="section"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="section-label">最近の記録</div><button id="undo-btn" style="font-size:12px;color:#999;background:none;border:none;cursor:pointer;">↩ 取り消し</button></div>';
      state.logs.slice(0,5).forEach(function(l){
        var mIdx=state.members.findIndex(function(m){return m.id===l.memberId;});
        var c=memberColor(mIdx);
        var mName=(state.members.find(function(m){return m.id===l.memberId;})||{name:"?"}).name;
        home+='<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafafa;border-radius:10px;margin-bottom:8px;border-left:3px solid '+c.bg+';"><span style="font-size:20px;">'+l.taskIcon+'</span><div style="flex:1;"><div style="font-size:14px;font-weight:500;">'+l.taskName+'</div><div style="font-size:11px;color:#bbb;">'+formatDt(l.ts)+'</div></div><span style="font-size:12px;font-weight:600;color:'+c.text+';">'+mName+'</span><span style="font-size:12px;color:#FF6B6B;font-weight:700;">+'+l.points+'pt</span></div>';
      });
      home+='</div>';
    }
  }

  var stats_html='';
  if(state.screen==="stats"){
    stats_html+='<div class="section"><div style="display:flex;gap:8px;">';
    [["week","今週"],["month","今月"],["all","全期間"]].forEach(function(r){
      stats_html+='<button class="range-btn" data-range="'+r[0]+'" style="flex:1;border:none;border-radius:10px;padding:8px 0;font-weight:600;font-size:13px;cursor:pointer;background:'+(state.statsRange===r[0]?"#2d2d2d":"#f0f0f0")+';color:'+(state.statsRange===r[0]?"#fff":"#555")+';">'+r[1]+'</button>';
    });
    stats_html+='</div></div>';
    stats_html+='<div class="section"><div class="section-label">貢献スコア</div>';
    if(totalPts===0){stats_html+='<div style="text-align:center;color:#ccc;padding:20px;">まだ記録がありません</div>';}
    else{
      stats.forEach(function(m,i){
        var c=memberColor(i),pct=Math.round(m.total/totalPts*100);
        stats_html+='<div style="margin-bottom:16px;"><div style="font-size:14px;font-weight:600;margin-bottom:6px;">'+m.name+'</div><div style="background:#f0f0f0;border-radius:100px;height:12px;overflow:hidden;margin-bottom:4px;"><div style="height:100%;border-radius:100px;width:'+pct+'%;background:'+c.bg+';transition:width 0.4s;"></div></div><div style="display:flex;justify-content:space-between;"><span style="color:'+c.text+';font-weight:700;">'+m.total+'pt</span><span style="font-size:12px;color:#999;">'+pct+'%</span></div></div>';
      });
    }
    stats_html+='</div>';
    var fl=getFilteredLogs();
    if(fl.length>0){
      stats_html+='<div class="section"><div class="section-label">タスク別内訳</div>';
      state.members.forEach(function(m,i){
        var c=memberColor(i);
        var mLogs=fl.filter(function(l){return l.memberId===m.id;});
        if(!mLogs.length)return;
        var tc={};
        mLogs.forEach(function(l){tc[l.taskName]=(tc[l.taskName]||0)+1;});
        stats_html+='<div style="margin-bottom:16px;"><div style="padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;margin-bottom:8px;background:'+c.light+';color:'+c.text+';">'+m.name+'</div><div style="display:flex;flex-wrap:wrap;gap:6px;">';
        Object.keys(tc).forEach(function(n){stats_html+='<div style="background:#f7f7f5;border-radius:8px;padding:4px 10px;font-size:12px;display:flex;gap:6px;"><span>'+n+'</span><span style="color:'+c.text+';font-weight:600;">'+tc[n]+'回</span></div>';});
        stats_html+='</div></div>';
      });
      stats_html+='</div>';
    }
  }

  var settings_html='';
  if(state.screen==="settings"){
    settings_html+='<div class="section"><div class="section-label">グループ情報</div><div style="background:#f7f7f5;border-radius:12px;padding:16px;margin-bottom:12px;"><div style="font-size:12px;color:#999;margin-bottom:4px;">招待コード（パートナーに共有）</div><div style="font-size:28px;font-weight:700;letter-spacing:6px;color:#333;text-align:center;padding:8px 0;">'+groupId+'</div></div><button id="btn-leave" style="width:100%;background:#fff0f0;color:#FF6B6B;border:1.5px solid #FF6B6B;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;">グループから退出</button></div>';
    settings_html+='<div class="section"><div class="section-label">メンバー管理</div>';
    state.members.forEach(function(m,i){
      var c=memberColor(i);
      settings_html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;"><span style="width:12px;height:12px;border-radius:100px;background:'+c.bg+';display:inline-block;"></span><span style="flex:1;font-size:14px;">'+m.name+'</span><button class="del-member" data-id="'+m.id+'" style="font-size:12px;color:#FF6B6B;background:none;border:none;cursor:pointer;">削除</button></div>';
    });
    settings_html+='<div style="display:flex;gap:8px;margin-top:8px;"><input id="new-member" class="input" style="margin:0;flex:1;" placeholder="新しいメンバーの名前" value="'+state.newMemberName+'" /><button id="add-member" style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">追加</button></div></div>';
    settings_html+='<div class="section"><div class="section-label">タスク管理</div>';
    state.tasks.forEach(function(t){
      settings_html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;"><span>'+t.icon+'</span><span style="flex:1;font-size:14px;">'+t.name+'</span><span style="font-size:12px;color:#999;">'+t.points+'pt</span><button class="del-task" data-id="'+t.id+'" style="font-size:12px;color:#FF6B6B;background:none;border:none;cursor:pointer;">削除</button></div>';
    });
    settings_html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"><input id="new-task-icon" class="input" style="margin:0;flex:0 0 44px;text-align:center;" value="'+state.newTaskIcon+'" maxlength="2" /><input id="new-task-name" class="input" style="margin:0;flex:1;" placeholder="タスク名" value="'+state.newTaskName+'" /><input id="new-task-pts" type="number" min="1" max="10" class="input" style="margin:0;flex:0 0 50px;text-align:center;" value="'+state.newTaskPoints+'" /><button id="add-task" style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">追加</button></div></div>';
    settings_html+='<div class="section"><div class="section-label">データ</div><button id="clear-logs" style="width:100%;background:#fff0f0;color:#FF6B6B;border:1.5px solid #FF6B6B;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;">記録をすべて削除</button></div>';
  }

  var recurring_html='';
  if(state.screen==="recurring"){
    // メンバー選択（共通）
    recurring_html+='<div class="section"><div class="section-label">だれがやる？</div><div style="display:flex;gap:10px;flex-wrap:wrap;">';
    state.members.forEach(function(m,i){
      var c=memberColor(i),a=state.selectedMember===m.id;
      recurring_html+='<button class="member-btn" data-id="'+m.id+'" style="padding:10px 20px;border-radius:100px;font-weight:600;font-size:15px;cursor:pointer;border:2px solid '+(a?c.bg:c.bg+'30')+';background:'+(a?c.bg:c.light)+';color:'+(a?'#fff':c.text)+';transform:'+(a?'scale(1.06)':'scale(1)')+';transition:all 0.15s;">'+m.name+'</button>';
    });
    recurring_html+='</div></div>';

    // 期日順にソート（超過したもの・近いものを上に）
    var sortedRec=state.recurring.slice().sort(function(a,b){return (a.nextDueMs||0)-(b.nextDueMs||0);});
    var overdue=sortedRec.filter(function(r){return daysUntil(r.nextDueMs)<0;});
    var upcoming=sortedRec.filter(function(r){return daysUntil(r.nextDueMs)>=0;});

    if(overdue.length>0){
      recurring_html+='<div class="section"><div class="section-label" style="color:#FF6B6B;">⚠️ 期日超過</div>';
      overdue.forEach(function(r){
        var s=formatDueStatus(r);
        recurring_html+='<div style="display:flex;align-items:center;gap:10px;padding:12px;background:'+s.bg+';border-radius:12px;margin-bottom:8px;border-left:4px solid '+s.color+';"><span style="font-size:28px;">'+r.icon+'</span><div style="flex:1;"><div style="font-size:14px;font-weight:600;">'+r.name+'</div><div style="font-size:11px;color:'+s.color+';font-weight:600;margin-top:2px;">'+s.text+' · '+formatInterval(r.intervalDays)+'ごと · +'+r.points+'pt</div></div><button class="rec-complete" data-rec=\''+JSON.stringify(r).replace(/'/g,"&#39;")+'\' style="background:'+s.color+';color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;">完了</button></div>';
      });
      recurring_html+='</div>';
    }

    if(upcoming.length>0){
      recurring_html+='<div class="section"><div class="section-label">予定</div>';
      upcoming.forEach(function(r){
        var s=formatDueStatus(r);
        recurring_html+='<div style="display:flex;align-items:center;gap:10px;padding:12px;background:#fafafa;border-radius:12px;margin-bottom:8px;"><span style="font-size:24px;">'+r.icon+'</span><div style="flex:1;"><div style="font-size:14px;font-weight:600;">'+r.name+'</div><div style="font-size:11px;color:'+s.color+';margin-top:2px;">'+s.text+' · '+formatInterval(r.intervalDays)+'ごと · +'+r.points+'pt</div></div><button class="rec-complete" data-rec=\''+JSON.stringify(r).replace(/'/g,"&#39;")+'\' style="background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">完了</button></div>';
      });
      recurring_html+='</div>';
    }

    if(state.recurring.length===0){
      recurring_html+='<div class="section"><div style="text-align:center;color:#ccc;padding:20px;font-size:13px;">まだ定期タスクがありません<br>下から追加してください</div></div>';
    }

    // 追加フォーム
    recurring_html+='<div class="section"><div class="section-label">定期タスクを追加</div>';
    recurring_html+='<div style="display:flex;gap:8px;margin-bottom:8px;"><input id="new-rec-icon" class="input" style="margin:0;flex:0 0 44px;text-align:center;" value="'+state.newRecurringIcon+'" maxlength="2" /><input id="new-rec-name" class="input" style="margin:0;flex:1;" placeholder="タスク名（例：エアコン掃除）" value="'+state.newRecurringName+'" /></div>';
    recurring_html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><span style="font-size:12px;color:#999;width:60px;">頻度</span><select id="new-rec-interval" class="input" style="margin:0;flex:1;">';
    [[1,"毎日"],[7,"1週間ごと"],[14,"2週間ごと"],[30,"1ヶ月ごと"],[90,"3ヶ月ごと"],[180,"半年ごと"],[365,"1年ごと"]].forEach(function(opt){
      recurring_html+='<option value="'+opt[0]+'"'+(state.newRecurringInterval===opt[0]?" selected":"")+'>'+opt[1]+'</option>';
    });
    recurring_html+='</select></div>';
    recurring_html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><span style="font-size:12px;color:#999;width:60px;">ポイント</span><input id="new-rec-pts" type="number" min="1" max="20" class="input" style="margin:0;flex:1;" value="'+state.newRecurringPoints+'" /></div>';
    recurring_html+='<button id="add-rec" style="width:100%;background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;">追加</button>';

    // 既存の定期タスク一覧（削除可能）
    if(state.recurring.length>0){
      recurring_html+='<div style="margin-top:16px;border-top:1px solid #f0f0f0;padding-top:12px;"><div style="font-size:11px;color:#999;margin-bottom:8px;">管理</div>';
      state.recurring.forEach(function(r){
        recurring_html+='<div style="display:flex;align-items:center;gap:10px;padding:6px 0;"><span>'+r.icon+'</span><span style="flex:1;font-size:13px;">'+r.name+'</span><span style="font-size:11px;color:#999;">'+formatInterval(r.intervalDays)+'</span><button class="del-rec" data-id="'+r.id+'" style="font-size:12px;color:#FF6B6B;background:none;border:none;cursor:pointer;">削除</button></div>';
      });
      recurring_html+='</div>';
    }
    recurring_html+='</div>';
  }

  var nav='<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;z-index:10;">';
  // 期日超過の件数を表示
  var overdueCount=state.recurring.filter(function(r){return daysUntil(r.nextDueMs)<0;}).length;
  [["home","記録","✏️"],["recurring","定期","📅",overdueCount],["stats","グラフ","📊"],["settings","設定","⚙️"]].forEach(function(t){
    var badge=(t[3]&&t[3]>0)?'<span style="position:absolute;top:6px;right:50%;margin-right:-22px;background:#FF6B6B;color:#fff;font-size:9px;font-weight:700;border-radius:100px;padding:2px 5px;min-width:16px;text-align:center;">'+t[3]+'</span>':'';
    nav+='<button class="nav-btn" data-screen="'+t[0]+'" style="flex:1;background:none;border:none;padding:10px 0 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:'+(state.screen===t[0]?"#FF6B6B":"#999")+';position:relative;"><span style="font-size:22px;">'+t[2]+'</span><span style="font-size:10px;font-weight:600;">'+t[1]+'</span>'+badge+'</button>';
  });
  nav+='</div>';

  return '<div style="background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;"><span style="font-weight:700;font-size:17px;">🏠 家事ログ</span><div style="display:flex;align-items:center;gap:8px;"><span id="show-code" style="font-size:11px;color:#bbb;background:#f5f5f5;padding:3px 8px;border-radius:100px;cursor:pointer;">🔑 '+groupId+'</span><span style="font-size:12px;color:#999;">'+getWeekRange()+'</span></div></div><div style="flex:1;overflow-y:auto;padding-bottom:80px;">'+home+recurring_html+stats_html+settings_html+'</div>'+nav;
}

function bindMain(){
  var sc=document.getElementById("show-code");
  if(sc)sc.onclick=function(){showToast("招待コード: "+groupId);};
  document.querySelectorAll(".member-btn").forEach(function(btn){
    btn.onclick=function(){var id=btn.dataset.id;state.selectedMember=state.selectedMember===id?null:id;render();};
  });
  document.querySelectorAll(".task-btn").forEach(function(btn){
    btn.onclick=function(){logTask(JSON.parse(btn.dataset.task));};
  });
  var ub=document.getElementById("undo-btn");
  if(ub)ub.onclick=undoLast;
  document.querySelectorAll(".range-btn").forEach(function(btn){
    btn.onclick=function(){state.statsRange=btn.dataset.range;render();};
  });
  document.querySelectorAll(".nav-btn").forEach(function(btn){
    btn.onclick=function(){state.screen=btn.dataset.screen;render();};
  });
  var bl=document.getElementById("btn-leave");
  if(bl)bl.onclick=leaveGroup;
  var nm=document.getElementById("new-member");
  if(nm)nm.oninput=function(e){state.newMemberName=e.target.value;};
  var am=document.getElementById("add-member");
  if(am)am.onclick=addMember;
  document.querySelectorAll(".del-member").forEach(function(btn){
    btn.onclick=function(){deleteMember(btn.dataset.id);};
  });
  var ni=document.getElementById("new-task-icon");
  if(ni)ni.oninput=function(e){state.newTaskIcon=e.target.value;};
  var nt=document.getElementById("new-task-name");
  if(nt)nt.oninput=function(e){state.newTaskName=e.target.value;};
  var np=document.getElementById("new-task-pts");
  if(np)np.oninput=function(e){state.newTaskPoints=Number(e.target.value);};
  var at=document.getElementById("add-task");
  if(at)at.onclick=addTask;
  var cl=document.getElementById("clear-logs");
  if(cl)cl.onclick=clearLogs;

  // 定期タスク
  document.querySelectorAll(".rec-complete").forEach(function(btn){
    btn.onclick=function(){completeRecurring(JSON.parse(btn.dataset.rec));};
  });
  document.querySelectorAll(".del-rec").forEach(function(btn){
    btn.onclick=function(){if(confirm("削除しますか？"))deleteRecurring(btn.dataset.id);};
  });
  var nri=document.getElementById("new-rec-icon");
  if(nri)nri.oninput=function(e){state.newRecurringIcon=e.target.value;};
  var nrn=document.getElementById("new-rec-name");
  if(nrn)nrn.oninput=function(e){state.newRecurringName=e.target.value;};
  var nrv=document.getElementById("new-rec-interval");
  if(nrv)nrv.onchange=function(e){state.newRecurringInterval=Number(e.target.value);};
  var nrp=document.getElementById("new-rec-pts");
  if(nrp)nrp.oninput=function(e){state.newRecurringPoints=Number(e.target.value);};
  var ar=document.getElementById("add-rec");
  if(ar)ar.onclick=addRecurring;
}
</script>

</body>
</html>
