<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>家事ログ</title>

  <!-- ========================================================
    🔧 STEP 1: ここにFirebaseの設定を貼り付けてください
    Firebase Console → プロジェクト設定 → アプリ → firebaseConfig
  ======================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getFirestore, collection, doc, setDoc, deleteDoc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDU9BcaCWGqapWezTqwYzYsywpCjfstSiE",
      authDomain: "housework-80f77.firebaseapp.com",
      projectId: "housework-80f77",
      storageBucket: "housework-80f77.firebasestorage.app",
      messagingSenderId: "26580994101",
      appId: "1:26580994101:web:2bc4d94f0ba84d11c2097c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- ユーティリティ ----
    const DEFAULT_TASKS = [
      { id: "t1", name: "料理",     icon: "🍳", points: 3 },
      { id: "t2", name: "食器洗い", icon: "🍽️", points: 2 },
      { id: "t3", name: "洗濯",     icon: "👕", points: 2 },
      { id: "t4", name: "掃除機",   icon: "🧹", points: 2 },
      { id: "t5", name: "風呂掃除", icon: "🛁", points: 2 },
      { id: "t6", name: "買い物",   icon: "🛒", points: 2 },
      { id: "t7", name: "ゴミ出し", icon: "🗑️", points: 1 },
      { id: "t8", name: "トイレ掃除","icon": "🚽", points: 1 },
    ];

    const MEMBER_COLORS = [
      { bg: "#FF6B6B", light: "#FFE5E5", text: "#c0392b" },
      { bg: "#4ECDC4", light: "#E0F7F5", text: "#1a8c87" },
      { bg: "#FFD93D", light: "#FFF9E0", text: "#b7860b" },
      { bg: "#A78BFA", light: "#EDE9FE", text: "#6d28d9" },
    ];

    function memberColor(idx) { return MEMBER_COLORS[idx % MEMBER_COLORS.length]; }

    function formatDatetime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const mm = d.getMonth() + 1;
      const dd = d.getDate();
      const hh = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${mm}/${dd} ${hh}:${min}`;
    }

    function getWeekRange() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(now); mon.setDate(diff);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
      return `${fmt(mon)} 〜 ${fmt(sun)}`;
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    function getWeekKeys() {
      const keys = [];
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(now); mon.setDate(diff);
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon); d.setDate(mon.getDate() + i);
        keys.push(`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`);
      }
      return keys;
    }

    // ---- State ----
    let state = {
      screen: "home",
      members: [],
      tasks: [...DEFAULT_TASKS],
      logs: [],
      selectedMember: null,
      statsRange: "week",
      newMemberName: "",
      newTaskName: "",
      newTaskIcon: "✨",
      newTaskPoints: 2,
      synced: false,
    };

    // ---- Firestore listeners ----
    onSnapshot(collection(db, "members"), snap => {
      state.members = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      render();
    });

    onSnapshot(collection(db, "tasks"), snap => {
      const loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.tasks = loaded.length > 0 ? loaded : [...DEFAULT_TASKS];
      render();
    });

    onSnapshot(query(collection(db, "logs"), orderBy("ts", "desc")), snap => {
      state.logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.synced = true;
      render();
    });

    // ---- Actions ----
    async function logTask(task) {
      if (!state.selectedMember) { showToast("メンバーを選んでね！"); return; }
      const id = Date.now().toString();
      await setDoc(doc(db, "logs", id), {
        memberId: state.selectedMember,
        taskId: task.id,
        taskName: task.name,
        taskIcon: task.icon,
        points: task.points,
        date: getTodayKey(),
        ts: serverTimestamp(),
      });
      showToast(`${task.icon} ${task.name} を記録したよ！`);
    }

    async function undoLast() {
      if (state.logs.length === 0) return;
      await deleteDoc(doc(db, "logs", state.logs[0].id));
      showToast("最後の記録を取り消したよ");
    }

    async function addMember() {
      const name = state.newMemberName.trim();
      if (!name) return;
      const id = Date.now().toString();
      await setDoc(doc(db, "members", id), { name, order: state.members.length });
      state.newMemberName = "";
      showToast("メンバーを追加しました");
    }

    async function deleteMember(id) {
      if (state.members.length <= 1) { showToast("最低1人は必要です"); return; }
      await deleteDoc(doc(db, "members", id));
      if (state.selectedMember === id) state.selectedMember = null;
    }

    async function addTask() {
      const name = state.newTaskName.trim();
      if (!name) return;
      const id = Date.now().toString();
      await setDoc(doc(db, "tasks", id), {
        name,
        icon: state.newTaskIcon || "✨",
        points: state.newTaskPoints,
      });
      state.newTaskName = ""; state.newTaskIcon = "✨"; state.newTaskPoints = 2;
      showToast("タスクを追加しました");
    }

    async function deleteTask(id) {
      await deleteDoc(doc(db, "tasks", id));
    }

    async function clearLogs() {
      if (!confirm("全ての記録を削除しますか？")) return;
      for (const l of state.logs) await deleteDoc(doc(db, "logs", l.id));
      showToast("記録を削除しました");
    }

    // ---- Toast ----
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.opacity = "1";
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2000);
    }

    // ---- Stats ----
    function getFilteredLogs() {
      if (state.statsRange === "week") {
        const keys = getWeekKeys();
        return state.logs.filter(l => keys.includes(l.date));
      }
      if (state.statsRange === "month") {
        const now = new Date();
        const prefix = `${now.getFullYear()}-${now.getMonth()+1}`;
        return state.logs.filter(l => l.date && l.date.startsWith(prefix));
      }
      return state.logs;
    }

    function getStats() {
      const filtered = getFilteredLogs();
      return state.members.map(m => ({
        ...m,
        total: filtered.filter(l => l.memberId === m.id).reduce((s, l) => s + (l.points||0), 0),
        count: filtered.filter(l => l.memberId === m.id).length,
      }));
    }

    // ---- Render ----
    function render() {
      const root = document.getElementById("app");
      if (!state.synced && state.members.length === 0) {
        root.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:80vh;color:#999;font-size:14px;">読み込み中…</div>`;
        return;
      }

      // Setup screen
      if (state.members.length === 0) {
        root.innerHTML = setupHTML();
        bindSetup();
        return;
      }

      root.innerHTML = mainHTML();
      bindMain();
    }

    function setupHTML() {
      return `
      <div style="margin:60px 24px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 4px 20px #0000000f;text-align:center;">
        <div style="font-size:56px;margin-bottom:16px;">🏠</div>
        <h1 style="font-size:20px;font-weight:700;margin-bottom:8px;">家事分担アプリへようこそ</h1>
        <p style="font-size:14px;color:#999;margin-bottom:24px;">最初にメンバーを登録しましょう</p>
        <div style="display:flex;gap:8px;">
          <input id="setup-name" style="flex:1;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;" placeholder="名前を入力（例：たろう）" value="${state.newMemberName}" />
          <button id="setup-add" style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">追加</button>
        </div>
      </div>`;
    }

    function bindSetup() {
      document.getElementById("setup-name").addEventListener("input", e => state.newMemberName = e.target.value);
      document.getElementById("setup-name").addEventListener("keydown", e => { if (e.key === "Enter") addMember(); });
      document.getElementById("setup-add").addEventListener("click", addMember);
    }

    function mainHTML() {
      const stats = getStats();
      const totalPts = stats.reduce((s, m) => s + m.total, 0);

      return `
      <!-- Header -->
      <div style="background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;">
        <span style="font-weight:700;font-size:17px;">🏠 家事ログ</span>
        <span style="font-size:12px;color:#999;">${getWeekRange()}</span>
      </div>

      <!-- Content -->
      <div style="flex:1;overflow-y:auto;padding-bottom:80px;">

        ${state.screen === "home" ? `
        <!-- Member selector -->
        <div class="section">
          <div class="section-label">だれがやる？</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            ${state.members.map((m, i) => {
              const c = memberColor(i);
              const active = state.selectedMember === m.id;
              return `<button class="member-btn" data-id="${m.id}"
                style="padding:10px 20px;border-radius:100px;font-weight:600;font-size:15px;cursor:pointer;border:2px solid ${active ? c.bg : c.bg+'30'};background:${active ? c.bg : c.light};color:${active ? '#fff' : c.text};transform:${active ? 'scale(1.06)' : 'scale(1)'};transition:all 0.15s;">
                ${m.name}
              </button>`;
            }).join("")}
          </div>
        </div>

        <!-- Task grid -->
        <div class="section">
          <div class="section-label">何をした？</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
            ${state.tasks.map(t => `
              <button class="task-btn" data-task='${JSON.stringify(t).replace(/'/g,"&#39;")}' style="background:#f7f7f5;border:none;border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span style="font-size:28px;">${t.icon}</span>
                <span style="font-size:12px;font-weight:600;color:#333;">${t.name}</span>
                <span style="font-size:11px;color:#FF6B6B;font-weight:700;">+${t.points}pt</span>
              </button>`).join("")}
          </div>
        </div>

        <!-- Recent logs -->
        ${state.logs.length > 0 ? `
        <div class="section">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="section-label">最近の記録</div>
            <button id="undo-btn" style="font-size:12px;color:#999;background:none;border:none;cursor:pointer;">↩ 取り消し</button>
          </div>
          ${state.logs.slice(0, 5).map(l => {
            const mIdx = state.members.findIndex(m => m.id === l.memberId);
            const c = memberColor(mIdx);
            const mName = state.members.find(m => m.id === l.memberId)?.name || "?";
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafafa;border-radius:10px;margin-bottom:8px;border-left:3px solid ${c.bg};">
              <span style="font-size:20px;">${l.taskIcon}</span>
              <div style="flex:1;">
                <div style="font-size:14px;font-weight:500;">${l.taskName}</div>
                <div style="font-size:11px;color:#bbb;">${formatDatetime(l.ts)}</div>
              </div>
              <span style="font-size:12px;font-weight:600;color:${c.text};">${mName}</span>
              <span style="font-size:12px;color:#FF6B6B;font-weight:700;">+${l.points}pt</span>
            </div>`;
          }).join("")}
        </div>` : ""}
        ` : ""}

        ${state.screen === "stats" ? `
        <!-- Range selector -->
        <div class="section">
          <div style="display:flex;gap:8px;">
            ${["week","month","all"].map(r => `
              <button class="range-btn" data-range="${r}" style="flex:1;border:none;border-radius:10px;padding:8px 0;font-weight:600;font-size:13px;cursor:pointer;background:${state.statsRange===r?"#2d2d2d":"#f0f0f0"};color:${state.statsRange===r?"#fff":"#555"};">
                ${r==="week"?"今週":r==="month"?"今月":"全期間"}
              </button>`).join("")}
          </div>
        </div>

        <!-- Score bars -->
        <div class="section">
          <div class="section-label">貢献スコア</div>
          ${stats.length === 0 || totalPts === 0 ? `<div style="text-align:center;color:#ccc;padding:20px;">まだ記録がありません</div>` :
            stats.map((m, i) => {
              const c = memberColor(i);
              const pct = totalPts > 0 ? Math.round(m.total / totalPts * 100) : 0;
              return `
              <div style="margin-bottom:16px;">
                <div style="font-size:14px;font-weight:600;margin-bottom:6px;">${m.name}</div>
                <div style="background:#f0f0f0;border-radius:100px;height:12px;overflow:hidden;margin-bottom:4px;">
                  <div style="height:100%;border-radius:100px;width:${pct}%;background:${c.bg};transition:width 0.4s;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:${c.text};font-weight:700;">${m.total}pt</span>
                  <span style="font-size:12px;color:#999;">${pct}%</span>
                </div>
              </div>`;
            }).join("")}
        </div>

        <!-- Task breakdown -->
        ${getFilteredLogs().length > 0 ? `
        <div class="section">
          <div class="section-label">タスク別内訳</div>
          ${state.members.map((m, i) => {
            const c = memberColor(i);
            const mLogs = getFilteredLogs().filter(l => l.memberId === m.id);
            if (!mLogs.length) return "";
            const taskCount = {};
            mLogs.forEach(l => { taskCount[l.taskName] = (taskCount[l.taskName]||0)+1; });
            return `
            <div style="margin-bottom:16px;">
              <div style="padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;margin-bottom:8px;background:${c.light};color:${c.text};">${m.name}</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${Object.entries(taskCount).map(([name,cnt]) => `
                  <div style="background:#f7f7f5;border-radius:8px;padding:4px 10px;font-size:12px;display:flex;gap:6px;">
                    <span>${name}</span><span style="color:${c.text};font-weight:600;">${cnt}回</span>
                  </div>`).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>` : ""}
        ` : ""}

        ${state.screen === "settings" ? `
        <!-- Members -->
        <div class="section">
          <div class="section-label">メンバー管理</div>
          ${state.members.map((m, i) => {
            const c = memberColor(i);
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;">
              <span style="width:12px;height:12px;border-radius:100px;background:${c.bg};display:inline-block;"></span>
              <span style="flex:1;font-size:14px;">${m.name}</span>
              <button class="del-member" data-id="${m.id}" style="font-size:12px;color:#FF6B6B;background:none;border:none;cursor:pointer;">削除</button>
            </div>`;
          }).join("")}
          <div style="display:flex;gap:8px;margin-top:8px;">
            <input id="new-member" style="flex:1;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;" placeholder="新しいメンバーの名前" value="${state.newMemberName}" />
            <button id="add-member" style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">追加</button>
          </div>
        </div>

        <!-- Tasks -->
        <div class="section">
          <div class="section-label">タスク管理</div>
          ${state.tasks.map(t => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;">
              <span>${t.icon}</span>
              <span style="flex:1;font-size:14px;">${t.name}</span>
              <span style="font-size:12px;color:#999;">${t.points}pt</span>
              <button class="del-task" data-id="${t.id}" style="font-size:12px;color:#FF6B6B;background:none;border:none;cursor:pointer;">削除</button>
            </div>`).join("")}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <input id="new-task-icon" style="flex:0 0 44px;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 8px;font-size:14px;outline:none;text-align:center;" value="${state.newTaskIcon}" maxlength="2" />
            <input id="new-task-name" style="flex:1;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;" placeholder="タスク名" value="${state.newTaskName}" />
            <input id="new-task-pts" type="number" min="1" max="10" style="flex:0 0 50px;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 8px;font-size:14px;outline:none;text-align:center;" value="${state.newTaskPoints}" />
            <button id="add-task" style="background:#FF6B6B;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">追加</button>
          </div>
        </div>

        <!-- Clear data -->
        <div class="section">
          <div class="section-label">データ</div>
          <button id="clear-logs" style="width:100%;background:#fff0f0;color:#FF6B6B;border:1.5px solid #FF6B6B;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;">記録をすべて削除</button>
        </div>
        ` : ""}

      </div>

      <!-- Bottom Nav -->
      <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;z-index:10;">
        ${[["home","記録","✏️"],["stats","グラフ","📊"],["settings","設定","⚙️"]].map(([id,label,icon]) => `
          <button class="nav-btn" data-screen="${id}" style="flex:1;background:none;border:none;padding:10px 0 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:${state.screen===id?"#FF6B6B":"#999"};">
            <span style="font-size:22px;">${icon}</span>
            <span style="font-size:10px;font-weight:600;">${label}</span>
          </button>`).join("")}
      </div>`;
    }

    function bindMain() {
      // Member select
      document.querySelectorAll(".member-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          state.selectedMember = state.selectedMember === id ? null : id;
          render();
        });
      });

      // Task log
      document.querySelectorAll(".task-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const task = JSON.parse(btn.dataset.task);
          logTask(task);
        });
      });

      // Undo
      document.getElementById("undo-btn")?.addEventListener("click", undoLast);

      // Stats range
      document.querySelectorAll(".range-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.statsRange = btn.dataset.range; render(); });
      });

      // Nav
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => { state.screen = btn.dataset.screen; render(); });
      });

      // Settings - members
      document.getElementById("new-member")?.addEventListener("input", e => state.newMemberName = e.target.value);
      document.getElementById("add-member")?.addEventListener("click", addMember);
      document.querySelectorAll(".del-member").forEach(btn => {
        btn.addEventListener("click", () => deleteMember(btn.dataset.id));
      });

      // Settings - tasks
      document.getElementById("new-task-icon")?.addEventListener("input", e => state.newTaskIcon = e.target.value);
      document.getElementById("new-task-name")?.addEventListener("input", e => state.newTaskName = e.target.value);
      document.getElementById("new-task-pts")?.addEventListener("input", e => state.newTaskPoints = Number(e.target.value));
      document.getElementById("add-task")?.addEventListener("click", addTask);
      document.querySelectorAll(".del-task").forEach(btn => {
        btn.addEventListener("click", () => deleteTask(btn.dataset.id));
      });

      // Clear logs
      document.getElementById("clear-logs")?.addEventListener("click", clearLogs);
    }

    render();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f7f7f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .section {
      background: #fff;
      margin: 12px 12px 0;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 4px #0000000a;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d2d2d;
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 4px 12px #0003;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    button:active { opacity: 0.75; }
