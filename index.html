function saveCache(key, data) { try { localStorage.setItem("chores_"+key, JSON.stringify(data)); } catch(e) {} }
function loadCache(key) { try { const d = localStorage.getItem("chores_"+key); return d ? JSON.parse(d) : null; } catch(e) { return null; } }

function generateCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

const DEFAULT_TASKS = [
  { id: "t1", name: "料理", icon: "🍳", points: 3 },
  { id: "t2", name: "食器洗い", icon: "🍽️", points: 2 },
  { id: "t3", name: "洗濯", icon: "👕", points: 2 },
  { id: "t4", name: "掃除機", icon: "🧹", points: 2 },
  { id: "t5", name: "風呂掃除", icon: "🛁", points: 2 },
  { id: "t6", name: "買い物", icon: "🛒", points: 2 },
  { id: "t7", name: "ゴミ出し", icon: "🗑️", points: 1 },
  { id: "t8", name: "トイレ掃除", icon: "🚽", points: 1 },
];
const MEMBER_COLORS = [
  { bg: "#FF6B6B", light: "#FFE5E5", text: "#c0392b" },
  { bg: "#4ECDC4", light: "#E0F7F5", text: "#1a8c87" },
  { bg: "#FFD93D", light: "#FFF9E0", text: "#b7860b" },
  { bg: "#A78BFA", light: "#EDE9FE", text: "#6d28d9" },
];
function memberColor(idx) { return MEMBER_COLORS[idx % MEMBER_COLORS.length]; }
function formatDatetime(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function getWeekRange() {
  const now = new Date(), day = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - day + (day===0?-6:1));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(mon)} 〜 ${fmt(sun)}`;
}
function getTodayKey() { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function getWeekKeys() {
  const now=new Date(), day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-day+(day===0?-6:1));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; });
}

// グループID管理
let groupId = loadCache("groupId");

let state = {
  screen: "home",
  groupScreen: groupId ? "app" : "welcome", // welcome | create | join | app
  members: loadCache("members") || [],
  tasks: loadCache("tasks") || [...DEFAULT_TASKS],
  logs: loadCache("logs") || [],
  selectedMember: null,
  statsRange: "week",
  newMemberName: "",
  newTaskName: "",
  newTaskIcon: "✨",
  newTaskPoints: 2,
  synced: false,
  joinCode: "",
  groupName: "",
  errorMsg: "",
};

if (state.members.length > 0) state.synced = true;

let unsubscribers = [];

function subscribeGroup(gid) {
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  if (!db) { state.synced = true; render(); return; }
  try {
    unsubscribers.push(onSnapshot(collection(db, "groups", gid, "members"), snap => {
      state.members = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
      saveCache("members", state.members);
      state.synced = true;
      render();
    }, e => { console.error(e); state.synced=true; render(); }));
    unsubscribers.push(onSnapshot(collection(db, "groups", gid, "tasks"), snap => {
      const l = snap.docs.map(d=>({id:d.id,...d.data()}));
      state.tasks = l.length > 0 ? l : [...DEFAULT_TASKS];
      saveCache("tasks", state.tasks);
      render();
    }, e => console.error(e)));
    unsubscribers.push(onSnapshot(query(collection(db, "groups", gid, "logs"), orderBy("ts","desc")), snap => {
      state.logs = snap.docs.map(d=>({id:d.id,...d.data()}));
      saveCache("logs", state.logs);
      state.synced = true;
      render();
    }, e => console.error(e)));
  } catch(e) { console.error(e); state.synced=true; render(); }
}

// 最初に即座に画面を描画してから、Firestoreの購読を開始
if (groupId) {
  subscribeGroup(groupId);
} else {
  state.synced = true;
}
render();
setTimeout(() => { if (!state.synced) { state.synced = true; render(); } }, 3000);

async function createGroup() {
  const name = state.groupName.trim();
  if (!name) { state.errorMsg = "グループ名を入力してください"; render(); return; }
  const code = generateCode();
  try {
    await setDoc(doc(db, "groups", code), { name, createdAt: serverTimestamp() });
    groupId = code;
    saveCache("groupId", code);
    saveCache("members", []);
    saveCache("tasks", []);
    saveCache("logs", []);
    state.members = []; state.tasks = [...DEFAULT_TASKS]; state.logs = [];
    state.groupScreen = "app";
    state.errorMsg = "";
    subscribeGroup(code);
    showToast(`グループ作成完了！招待コード: ${code}`);
    render();
  } catch(e) { state.errorMsg = "作成に失敗しました"; render(); }
}

async function joinGroup() {
  const code = state.joinCode.trim().toUpperCase();
  if (!code) { state.errorMsg = "招待コードを入力してください"; render(); return; }
  try {
    const snap = await getDoc(doc(db, "groups", code));
    if (!snap.exists()) { state.errorMsg = "グループが見つかりません"; render(); return; }
    groupId = code;
    saveCache("groupId", code);
    state.groupScreen = "app";
    state.errorMsg = "";
    subscribeGroup(code);
    showToast(`「${snap.data().name}」に参加しました！`);
    render();
  } catch(e) { state.errorMsg = "参加に失敗しました"; render(); }
}

function leaveGroup() {
  if (!confirm("このグループから退出しますか？")) return;
  unsubscribers.forEach(u => u()); unsubscribers = [];
  groupId = null;
  localStorage.removeItem("chores_groupId");
  localStorage.removeItem("chores_members");
  localStorage.removeItem("chores_tasks");
  localStorage.removeItem("chores_logs");
  state.members = []; state.tasks = [...DEFAULT_TASKS]; state.logs = [];
  state.groupScreen = "welcome"; state.synced = false;
  render();
}

async function logTask(task) {
  if(!state.selectedMember){showToast("メンバーを選んでね！");return;}
  try {
    await setDoc(doc(db,"groups",groupId,"logs",Date.now().toString()),{memberId:state.selectedMember,taskId:task.id,taskName:task.name,taskIcon:task.icon,points:task.points,date:getTodayKey(),ts:serverTimestamp()});
    showToast(`${task.icon} ${task.name} を記録したよ！`);
  } catch(e) { showToast("記録に失敗しました"); }
}
async function undoLast() { if(!state.logs.length)return; try { await deleteDoc(doc(db,"groups",groupId,"logs",state.logs[0].id)); showToast("取り消したよ"); } catch(e) {} }
async function addMember() { const n=state.newMemberName.trim(); if(!n)return; try { await setDoc(doc(db,"groups",groupId,"members",Date.now().toString()),{name:n,order:state.members.length}); state.newMemberName=""; showToast("追加しました"); } catch(e) { showToast("追加に失敗しました"); } }
async function deleteMember(id) { if(state.members.length<=1){showToast("最低1人必要");return;} try { await deleteDoc(doc(db,"groups",groupId,"members",id)); if(state.selectedMember===id)state.selectedMember=null; } catch(e) {} }
async function addTask() { const n=state.newTaskName.trim(); if(!n)return; try { await setDoc(doc(db,"groups",groupId,"tasks",Date.now().toString()),{name:n,icon:state.newTaskIcon||"✨",points:state.newTaskPoints}); state.newTaskName="";state.newTaskIcon="✨";state.newTaskPoints=2; showToast("追加しました"); } catch(e) {} }
async function deleteTask(id) { try { await deleteDoc(doc(db,"groups",groupId,"tasks",id)); } catch(e) {} }
async function clearLogs() { if(!confirm("全記録を削除しますか？"))return; for(const l of state.logs){ try { await deleteDoc(doc(db,"groups",groupId,"logs",l.id)); } catch(e){} } showToast("削除しました"); }

let toastTimer=null;
function showToast(msg) { const el=document.getElementById("toast"); el.textContent=msg; el.style.opacity="1"; if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.style.opacity="0";},2500); }

function getFilteredLogs() {
  if(state.statsRange==="week"){const k=getWeekKeys();return state.logs.filter(l=>k.includes(l.date));}
  if(state.statsRange==="month"){const now=new Date();const p=`${now.getFullYear()}-${now.getMonth()+1}`;return state.logs.filter(l=>l.date&&l.date.startsWith(p));}
  return state.logs;
}
function getStats() { const f=getFilteredLogs(); return state.members.map(m=>({...m,total:f.filter(l=>l.memberId===m.id).reduce((s,l)=>s+(l.points||0),0),count:f.filter(l=>l.memberId===m.id).length})); }

function render() {
  const root=document.getElementById("app");
  if (state.groupScreen !== "app") { root.innerHTML=groupHTML(); bindGroup(); return; }
  if(!state.synced && state.members.length===0){root.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:80vh;color:#999;">読み込み中…</div>`;return;}
  if(state.members.length===0){root.innerHTML=setupHTML();bindSetup();return;}
  root.innerHTML=mainHTML();bindMain();
}

function bindGroup() {
  document.getElementById("btn-create")?.addEventListener("click", () => { state.groupScreen="create"; state.errorMsg=""; render(); });
  document.getElementById("btn-join")?.addEventListener("click", () => { state.groupScreen="join"; state.errorMsg=""; render(); });
  document.getElementById("btn-back")?.addEventListener("click", () => { state.groupScreen="welcome"; state.errorMsg=""; render(); });
  document.getElementById("group-name")?.addEventListener("input", e => state.groupName=e.target.value);
  document.getElementById("btn-create-confirm")?.addEventListener("click", createGroup);
  document.getElementById("join-code")?.addEventListener("input", e => state.joinCode=e.target.value);
  document.getElementById("btn-join-confirm")?.addEventListener("click", joinGroup);
}
